services:
  web:
    image: ghcr.io/tosinshada/vuln-bank:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./static/uploads:/app/static/uploads
    networks:
      - vuln_network

networks:
  vuln_network:
    driver: bridge
